<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELI-Check</title>
<meta name="description" content="Checks ELISA plate reader results against the kit insert, tracks controls with Westgard rules, and audits the run register.">
<meta name="theme-color" content="#0e6e66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent)"/><g fill="var(--accent-ink)"><circle cx="10" cy="10" r="3"/><circle cx="16" cy="10" r="3" opacity=".55"/><circle cx="22" cy="10" r="3" opacity=".3"/><circle cx="10" cy="16" r="3" opacity=".3"/><circle cx="16" cy="16" r="3"/><circle cx="22" cy="16" r="3" opacity=".55"/><circle cx="10" cy="22" r="3" opacity=".55"/><circle cx="16" cy="22" r="3" opacity=".3"/><circle cx="22" cy="22" r="3"/></g></svg>
      <div>
        <h1>ELI-Check</h1>
        <p class="sub">Checks reader results against the kit insert</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#runs" data-tab="runs">Runs</a>
      <a href="#add" data-tab="add">Add run</a>
      <a href="#qc" data-tab="qc">QC charts</a>
      <a href="#audit" data-tab="audit">Audit</a>
      <a href="#assays" data-tab="assays">Assays</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot">
    <span>Runs are saved on this device only. Use Audit → Back up to keep a copy.</span>
    <span id="offline-state"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/assays.js"></script>
<script src="js/engine.js"></script>
<script src="js/parse.js"></script>
<script src="js/ocr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
